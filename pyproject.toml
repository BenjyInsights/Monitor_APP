[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor_app"
version = "1.0.0"
description = "High-fidelity energy monitoring framework for Python & PyTorch with Green AI grading and active optimization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
authors = [
    {name = "Benjamín Sánchez Calza", email = "sanchezcalzabenjamin@gmail.com"},
]
keywords = [
    "energy-monitoring",
    "green-ai",
    "pytorch",
    "gpu-power",
    "carbon-emissions",
    "sustainability",
    "early-stopping",
    "pareto-frontier",
    "tfm",
    "uned",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Telecommunications Industry",
]

dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "psutil>=7.0,<8.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.12,<1.0",
    "py-cpuinfo>=9.0,<10.0",
    "nvidia-ml-py>=12.0",
    "rich>=13.0,<15.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0",
    "mkdocs-mermaid2-plugin>=0.6",
    "mkdocstrings[python]>=0.23.0",
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.3",
]

[project.urls]
Homepage = "https://github.com/BenjyInsights/Monitor_APP"
Documentation = "https://monitor-app.readthedocs.io"
Repository = "https://github.com/BenjyInsights/Monitor_APP.git"
Issues = "https://github.com/BenjyInsights/Monitor_APP/issues"

[tool.setuptools]
packages = ["monitor_app"]
package-dir = {"" = "src"}

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "C901",  # function is too complex
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "--strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
]

[tool.coverage.run]
source = ["src/monitor_app"]
omit = [
    "*/tests/*",
    "**/__main__.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
