name: Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint (Ruff + Black)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort
      
      - name: Lint with Ruff
        run: ruff check src/ tests/ tools/ --show-fixes || true
      
      - name: Format check with Black
        run: black --check src/ tests/ tools/ || true
      
      - name: Import sort check with isort
        run: isort --check-only src/ tests/ tools/ || true

  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev]
      
      - name: Lint with Ruff
        run: ruff check src/ tests/ tools/
        continue-on-error: true
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short \
            --cov=src/monitor_app \
            --cov-report=term-missing
        continue-on-error: true
      
      - name: Test import
        run: python -c "from monitor_app import monitor_train; print('✓ Import successful')"

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pandas numpy torch
      
      - name: Type check with mypy
        run: mypy src/monitor_app --ignore-missing-imports --show-error-codes || true
        continue-on-error: true

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
      
      - name: Build source distribution
        run: python -m build --sdist
      
      - name: Build wheel distribution
        run: python -m build --wheel
      
      - name: Check built distributions
        run: |
          ls -lh dist/
          python -m pip install twine
          twine check dist/*

  security:
    name: Security Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install bandit
        run: pip install bandit
      
      - name: Security scan with Bandit
        run: |
          bandit -r src/monitor_app -ll || true
        continue-on-error: true
